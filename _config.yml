# Set to true once payment is received to restore the site
site_active: false

title: "Red Oak Security Services"
description: "Red Oak Security Services provides professional security guards, mobile patrol, investigations, and consulting services across Canada."

url: "https://redoaksecurityservices.ca"
baseurl: ""
logo: "/assets/images/logo.png"

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

include:
  - pages

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      description: "Red Oak Security Services provides professional security guards, mobile patrol, investigations, and consulting services across Canada."

  - scope:
      path: "legal"
    values:
      layout: "default"

permalink: /:title/

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - _site
  - .gitignore
  - .DS_Store